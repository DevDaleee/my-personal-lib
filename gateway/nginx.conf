# Gateway da Biblioteca Pessoal.
# Este arquivo substitui o /etc/nginx/conf.d/default.conf da imagem oficial,
# então ele descreve só o "site": para onde vai cada caminho.

server {
    # Porta dentro do container; o Compose liga a 8080 do host a ela.
    listen 80;

    location /auth {
        proxy_pass http://books:9090;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type" always;
                if ($request_method = OPTIONS) {
                    return 204;
                }
    }

     location /users {
        proxy_pass http://books:9090;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
                if ($request_method = OPTIONS) {
                    return 204;
                }
    }


    # Tudo que começa com /books (/books, /books?status=, /books/{id}/progress...).
    # Sem barra no final do location, para GET /books também combinar.
    location /books {
        # "books" é o nome do serviço no Compose. Sem nada depois da porta,
        # o Nginx repassa o caminho exatamente como chegou.
        proxy_pass http://books:9090;

        # Informa ao books quem é o cliente de verdade (o middleware RealIP do chi lê estes).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				add_header Access-Control-Allow-Origin * always;
				add_header Access-Control-Allow-Methods "GET, POST, PATCH, OPTIONS" always;
				add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
				if ($request_method = OPTIONS) {
					return 204;
				}
    }

    # Tudo que começa com /stats
    # Sem barra no final do location, para GET /stats também combinar.
    location /stats {
        proxy_pass http://stats:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
				add_header Access-Control-Allow-Origin * always;
				add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
				add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
				if ($request_method = OPTIONS) {
					return 204;
				}
    }

    # Swagger de cada serviço. Abrir /docs/books/index.html e /docs/stats/index.html.
    # O caminho depois da porta (/swagger/) troca o prefixo: /docs/books/index.html
    # chega ao books como /swagger/index.html. As requisições do "Try it out" saem
    # para /books, /auth, /stats... e passam pelas locations acima, como as do app.
    location /docs/books/ {
        proxy_pass http://books:9090/swagger/;
        proxy_set_header Host $host;
    }

    location /docs/stats/ {
        proxy_pass http://stats:9091/swagger/;
        proxy_set_header Host $host;
    }

    # O app web (build do Flutter) será servido em / no passo 3.
}
