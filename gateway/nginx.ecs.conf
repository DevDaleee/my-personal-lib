# Gateway da Biblioteca Pessoal na AWS (ECS Fargate).
# Mesmas rotas do nginx.conf do Compose, com duas diferenças:
#   1. No Fargate, todos os containers da task dividem a mesma rede, então
#      os serviços são encontrados em localhost, e não pelo nome do serviço.
#   2. O gateway também serve o build web do Flutter em /, que vem dentro
#      da imagem (ver gateway/Dockerfile).
# App e API ficam na mesma origem, então o CORS não é necessário aqui.

server {
    listen 80;

    location /auth {
        proxy_pass http://localhost:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /users {
        proxy_pass http://localhost:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sem barra no final do location, para GET /books também combinar.
    # As telas do app usam #/books/... (hash), então não conflitam com esta rota.
    location /books {
        proxy_pass http://localhost:9090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /stats {
        proxy_pass http://localhost:9091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger de cada serviço: /docs/books/index.html e /docs/stats/index.html.
    location /docs/books/ {
        proxy_pass http://localhost:9090/swagger/;
        proxy_set_header Host $host;
    }

    location /docs/stats/ {
        proxy_pass http://localhost:9091/swagger/;
        proxy_set_header Host $host;
    }

    # App web (build do Flutter). Qualquer caminho que não seja um arquivo
    # existente cai no index.html, e o Flutter decide qual tela mostrar.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
