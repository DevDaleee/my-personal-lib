services:
  books-postgres:
    image: postgres:16-alpine
    container_name: mpbpostgress
    environment:
      POSTGRES_USER: ${BOOKS_DB_USER}
      POSTGRES_PASSWORD: ${BOOKS_DB_PASS}
      POSTGRES_DB: ${BOOKS_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - books-postgres-data:/var/lib/postgresql/data
    # Diz ao Compose quando o banco está pronto para receber conexões.
    # O $$ faz o Compose passar o $ adiante, para o shell do container ler a variável.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

     # Roda "goose up" uma vez e termina. O books só sobe se ele terminar com sucesso.
  migrate-books:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      # Dentro da rede do Compose, o host do banco é o nome do serviço (postgres).
      GOOSE_DBSTRING: host=books-postgres user=${BOOKS_DB_USER} password=${BOOKS_DB_PASS} dbname=${BOOKS_DB_NAME} sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations/books
    depends_on:
      books-postgres:
        condition: service_healthy

  stats-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STATS_DB_USER}
      POSTGRES_PASSWORD: ${STATS_DB_PASS}
      POSTGRES_DB: ${STATS_DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - stats-postgres-data:/var/lib/postgresql/data
    # Diz ao Compose quando o banco está pronto para receber conexões.
    # O $$ faz o Compose passar o $ adiante, para o shell do container ler a variável.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Roda "goose up" uma vez e termina. O books só sobe se ele terminar com sucesso.
  migrate-stats:
    build:
      context: .
      target: migrate
    environment:
      GOOSE_DRIVER: postgres
      # Dentro da rede do Compose, o host do banco é o nome do serviço (postgres).
      GOOSE_DBSTRING: host=stats-postgres user=${STATS_DB_USER} password=${STATS_DB_PASS} dbname=${STATS_DB_NAME} sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations/stats
    depends_on:
      stats-postgres:
        condition: service_healthy

  # Servidor de mensagens: o books publica os eventos e o stats os consome.
  nats:
    image: nats:2.10-alpine
    # -js liga o JetStream (guarda as mensagens até o consumer confirmar).
    # -m 8222 liga o monitoramento HTTP (/healthz, /varz).
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # clientes (books e stats)
      - "8222:8222" # monitoramento
    # O nats.Connect tenta uma vez só: os serviços esperam o /healthz responder.
    # Aqui localhost é o próprio container do NATS.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 15

  stats:
    build:
      context: .
      target: stats
    ports:
      - "9091:9091"
    environment:
      # Sobrescreve o DSN do .env: dentro da rede do Compose, o host do banco
      # é o nome do serviço (postgres), e não localhost.
      STATS_DBSTRING: host=stats-postgres user=${STATS_DB_USER} password=${STATS_DB_PASS} dbname=${STATS_DB_NAME} sslmode=disable
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy
      stats-postgres:
        # Só sobe o Stats depois que o healthcheck do postgres passar...
        condition: service_healthy
      migrate-stats:
        # ...e depois que as migrations terminarem sem erro.
        condition: service_completed_successfully

  books:
    build: .
    ports:
      - "9090:9090"
    env_file: .env
    environment:
      # Sobrescreve os endereços do .env: dentro da rede do Compose, o host
      # é o nome do serviço (books-postgres, nats), e não localhost.
      GOOSE_DBSTRING: host=books-postgres user=${BOOKS_DB_USER} password=${BOOKS_DB_PASS} dbname=${BOOKS_DB_NAME} sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      books-postgres:
        # Só sobe o books depois que o healthcheck do postgres passar...
        condition: service_healthy
      migrate-books:
        # ...depois que as migrations terminarem sem erro...
        condition: service_completed_successfully
      nats:
        # ...e depois que o NATS estiver pronto para conexões.
        condition: service_healthy

  # Ponto único de entrada: o app fala só com o gateway, nunca direto com os serviços.
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      # Nosso arquivo no lugar do default.conf da imagem; ro = só leitura.
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - books

volumes:
  books-postgres-data:
  stats-postgres-data:
